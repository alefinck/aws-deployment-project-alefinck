name: Test

on:
  push:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements_flask.txt ]; then pip install -r app/requirements_flask.txt; fi
          pip install pytest

      - name: Run tests
        run: |
          pytest